# Graxella workspace CI (build plan task S-4).
#
# The three suites run as separate pytest invocations on purpose: each
# package has a top-level `tests` package, and collecting them together
# collides on the module name. Per-suite jobs are also the better CI
# shape — a memory-engine failure is visibly a memory-engine failure.
#
# Lint gate is critical-rules-only (syntax errors, undefined names) so it
# blocks real breakage without freezing the legacy style debt; tightening
# to full ruff is tracked with Phase 0 task 0C-2.
#
# TODO(0C-2): add the pinned-LangGraph adapter matrix (two versions) once
# the adapter contract tests exist.

name: ci

on:
  push:
  pull_request:

jobs:
  critical-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run ruff check --select E9,F63,F7,F82 packages
      # v0.1.0 shipped a stale package-local README stub as PyPI's
      # description because nothing checked the two READMEs matched.
      - run: uv run python scripts/check_readme_sync.py

  wheels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv run python scripts/check_wheels.py

  claims-scorecard:
    # benchmarks/eval_harness.py: a small, fast probe suite over the exact
    # claims an external code review broke (2026-08-30) -- gate evidence
    # isolation, drift classification precision, recipe robustness,
    # demotion thresholds, and (skipped gracefully with no local embedder
    # on a CI runner) semantic routing. Exits nonzero on regression.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run python benchmarks/eval_harness.py

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      # Gate scoped to the active Evidence-Loop core (see root pyproject
      # [tool.coverage] for the omission rationale + ratchet plan).
      - run: uv run pytest packages/graxella/tests --cov=packages/graxella/graxella

  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
        suite:
          - packages/graxella/tests
          - packages/agent2society/tests
          - packages/axon-fabric/tests
    name: pytest ${{ matrix.suite }} (py${{ matrix.python-version }})
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync
      - run: uv run pytest ${{ matrix.suite }} -q
