[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "graxella"
description = "Graph-native intelligence layer for agent runtimes — self-healing tool dispatch, mined rules, PROV-O audit."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
authors = [{ name = "Graxella contributors" }]
keywords = [
    "agents", "langgraph", "langchain", "mcp",
    "self-healing", "datalog", "provenance", "audit",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dynamic = ["version"]

# Honest dependencies (build plan 0C-1, started in S-3): the Beat 1 surface
# (Memory, Society, mesh, instrument) imports agent2society at package
# import time, and the Promotion Spec runs on pydantic.
#
# The memory engine (formerly the standalone `mnema` package) now ships
# INSIDE graxella as `graxella.mnema`. It was folded in deliberately: the
# name `mnema` on PyPI belongs to an unrelated third-party project, so a
# dependency on it would have resolved to the wrong package entirely.
# Folding it in also makes `pip install graxella` a single self-contained
# artifact with no cross-package version skew.
dependencies = [
    "pydantic>=2.7",
    "jsonschema>=4",           # constitution invariant schemas
    "agent2society>=0.5.3,<0.6",
    # graxella.mnema (the memory engine) loads these at import time --
    # verified by importing graxella and inspecting sys.modules, not assumed.
    "pydantic-settings>=2.2",  # graxella.mnema.config
    "sqlmodel>=0.0.16",        # graxella.mnema.adapters.sqlite.repository
    "sqlalchemy>=2",           # imported directly by the same repository module
    # @grx.tool RETURNS a LangChain BaseTool -- the primary API already
    # depends on that abstraction, so making it an extra was a fiction the
    # error message had to apologise for. `pip install graxella` must just
    # work. This is langchain-core only (httpx/pydantic/pyyaml/tenacity),
    # NOT langchain or langgraph.
    "langchain-core>=0.3",
]

[tool.uv.sources]
agent2society = { workspace = true }

[project.optional-dependencies]
# langchain-core is core now; this extra adds the graph runtime itself,
# needed only for the mesh/supervisor adapters and tutorials 08+.
langgraph = [
    "langgraph>=0.2",
]
ollama = [
    "langchain-ollama>=0.2",
]
mcp = [
    "mcp>=0.9",
]
otel = [
    "opentelemetry-api>=1.25",
]
# Dense local embeddings for recall + routing without a running Ollama.
# Lazy-imported, so the core install stays small: graxella.mnema's
# sentence-transformer embedder only loads when you ask for it.
embed = [
    "sentence-transformers>=3.0",
    "sqlite-vec>=0.1",
]
# The built-in drift healer's reasoning engine. DSPy is preferred; the
# `ollama` client is the zero-litellm fallback the healer uses when DSPy
# isn't importable, so `heal` stays installable even where DSPy's litellm
# backend can't unpack (e.g. Windows without long-path support). Neither is
# a core dependency: the governance layer runs without either -- drift just
# fails loudly until a healer or a promoted transform exists.
heal = [
    "dspy>=3",
    "ollama>=0.3",
]
examples = [
    "graxella[langgraph,ollama]",
]
dev = [
    "graxella[langgraph,ollama,mcp]",
    "pytest>=7",
]
all = [
    "graxella[langgraph,ollama,mcp]",
]

[project.scripts]
graxella = "graxella.cli.main:main"

# Point only at things that exist. graxella.ai is not registered and the
# old graxella/graxella org 404s -- dead links on a PyPI page read as an
# abandoned project. Update the owner here if the repo lands elsewhere.
[project.urls]
Homepage = "https://github.com/graxella/graxella"
Source = "https://github.com/graxella/graxella"
Issues = "https://github.com/graxella/graxella/issues"
Tutorials = "https://github.com/graxella/graxella/tree/master/tutorials"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["graxella*"]
exclude = ["examples*", "tests*"]

[tool.setuptools.dynamic]
version = { attr = "graxella._version.__version__" }

[tool.setuptools.package-data]
graxella = ["py.typed"]
